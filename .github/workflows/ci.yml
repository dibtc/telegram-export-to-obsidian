name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]
    name: tests (Python ${{ matrix.python-version }})
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Verify both scripts import on this Python (stdlib-only promise)
        run: |
          python -c "import ast; ast.parse(open('build_from_html.py', encoding='utf-8').read())"
          python -c "import ast; ast.parse(open('build_vault.py', encoding='utf-8').read())"

      - name: Run test suite
        run: python -m unittest discover -s tests -v
